name: CI

# Run on every push and pull request so the repo always shows a green (or red)
# check. CI exists from commit #1, not bolted on later — a broken main should be
# visible immediately.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the store integration tests — mocking the database
      # would test the mock. Tests skip gracefully if it is unreachable.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minisearch
          POSTGRES_PASSWORD: minisearch
          POSTGRES_DB: minisearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minisearch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://minisearch:minisearch@localhost:5432/minisearch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply database schema
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          psql "$DATABASE_URL" -f minisearch/store/schema.sql

      - name: Test (pytest)
        run: pytest -q
